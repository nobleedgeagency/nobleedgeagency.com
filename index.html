<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.title">Noble Edge Agency | Agence Marketing & Community Management</title>
  <meta name="description" content="Noble Edge Agency — Agence marketing et communication spécialisée en community management, stratégie digitale, création de contenu et publicité en ligne." data-i18n-attr="content:meta.description" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dark: #0a0a0f; --dark2: #12121a; --dark3: #1a1a28;
      --purple: #6c3fff; --purple-light: #8b5cf6; --purple-soft: #a78bfa;
      --white: #ffffff; --gray: #9ca3af; --gray-light: #d1d5db;
      --border: rgba(255,255,255,0.07); --card-bg: rgba(255,255,255,0.035);
      --radius: 16px; --radius-lg: 24px;
      --shadow: 0 8px 40px rgba(0,0,0,0.4); --shadow-purple: 0 0 40px rgba(108,63,255,0.25);
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: var(--dark); color: var(--white); line-height: 1.6; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: var(--dark2); } ::-webkit-scrollbar-thumb { background: var(--purple); border-radius: 3px; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    .gradient-text { background: linear-gradient(135deg, #fff 0%, var(--purple-soft) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(108,63,255,0.12); border: 1px solid rgba(108,63,255,0.3); color: var(--purple-soft); padding: 6px 16px; border-radius: 100px; font-size: 13px; font-weight: 500; }
    .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--purple-soft); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.25s ease; text-decoration: none; border: none; white-space: nowrap; }
    .btn-primary { background: linear-gradient(135deg, var(--purple) 0%, var(--purple-light) 100%); color: #fff; box-shadow: 0 4px 24px rgba(108,63,255,0.35); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(108,63,255,0.5); }
    .btn-secondary { background: rgba(255,255,255,0.06); color: #fff; border: 1px solid var(--border); backdrop-filter: blur(10px); }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
    .section-label { font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--purple-soft); margin-bottom: 12px; }
    .section-title { font-size: clamp(24px, 4vw, 42px); font-weight: 800; line-height: 1.15; margin-bottom: 16px; }
    .section-subtitle { font-size: 16px; color: var(--gray); max-width: 600px; line-height: 1.7; }

    header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; padding: 18px 0; transition: all 0.3s ease; background: rgba(10,10,15,0.98); backdrop-filter: blur(20px); border-bottom: 1px solid transparent; }
    header.scrolled { padding: 12px 0; }
    .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; flex-shrink: 0; }
    .logo-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--dark3) 0%, #2d1b69 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(108,63,255,0.3); flex-shrink: 0; }
    .logo-icon svg { width: 22px; height: 22px; }
    .logo-text { font-size: 17px; font-weight: 800; color: var(--white); letter-spacing: -0.3px; }
    .logo-text span { color: var(--purple-soft); }
    nav { display: flex; align-items: center; gap: 4px; }
    nav a { color: var(--gray); font-size: 14px; font-weight: 500; text-decoration: none; padding: 8px 12px; border-radius: 8px; transition: all 0.2s; white-space: nowrap; }
    nav a:hover { color: var(--white); background: rgba(255,255,255,0.06); }
    .header-cta { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .lang-switch { display: inline-flex; align-items: center; gap: 6px; padding: 6px; border: 1px solid var(--border); border-radius: 999px; background: rgba(255,255,255,0.05); }
    .lang-btn { background: transparent; border: none; color: var(--gray); font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 999px; cursor: pointer; transition: all 0.2s; }
    .lang-btn.active { background: rgba(108,63,255,0.2); color: var(--white); }
    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 8px; }
    .hamburger span { width: 22px; height: 2px; background: var(--white); border-radius: 2px; transition: all 0.3s; }
    .mobile-menu { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10,10,15,0.98); backdrop-filter: blur(20px); z-index: 999; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 20px; }
    .mobile-menu.open { display: flex; }
    .mobile-menu a { color: var(--white); font-size: 22px; font-weight: 700; text-decoration: none; transition: color 0.2s; }
    .mobile-menu a:hover { color: var(--purple-soft); }
    .mobile-close { position: absolute; top: 24px; right: 24px; font-size: 28px; cursor: pointer; color: var(--gray); background: none; border: none; }

    /* existing CSS continues unchanged... */
  </style>
</head>
<body>

<div class="mobile-menu" id="mobileMenu">
  <button class="mobile-close" onclick="toggleMenu()" aria-label="Close menu" data-i18n="mobile.close">✕</button>
  <a href="#hero" onclick="toggleMenu()" data-i18n="nav.home.mobile">Accueil</a>
  <a href="#services" onclick="toggleMenu()" data-i18n="nav.services.mobile">Services</a>
  <a href="#methode" onclick="toggleMenu()" data-i18n="nav.method.mobile">Méthode</a>
  <a href="#realisations" onclick="toggleMenu()" data-i18n="nav.results.mobile">Réalisations</a>
  <a href="#temoignages" onclick="toggleMenu()" data-i18n="nav.testimonials.mobile">Témoignages</a>
  <a href="#faq" onclick="toggleMenu()" data-i18n="nav.faq.mobile">FAQ</a>
  <a href="#contact" onclick="toggleMenu()" data-i18n="nav.contact.mobile">Contact</a>
  <a href="https://calendly.com/nobleedgeagency/ton-audit-gratuit" target="_blank" rel="noopener" class="btn btn-primary" onclick="toggleMenu()" data-i18n="nav.book.mobile">Réserver un appel</a>
</div>

<header id="mainHeader">
  <div class="container">
    <div class="header-inner">
      <a href="#hero" class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="4" width="7" height="2.5" rx="0.5" fill="white"/>
            <rect x="2" y="10.75" width="5.5" height="2.5" rx="0.5" fill="white"/>
            <rect x="2" y="17.5" width="7" height="2.5" rx="0.5" fill="white"/>
            <rect x="12.5" y="4" width="2.5" height="16" rx="0.5" fill="white"/>
            <rect x="19" y="4" width="2.5" height="16" rx="0.5" fill="white"/>
            <path d="M12.5 4 L22 20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="logo-text">Noble<span>Edge</span></span>
      </a>

      <nav>
        <a href="#pourquoi" data-i18n="nav.why">Pourquoi nous</a>
        <a href="#services" data-i18n="nav.services">Services</a>
        <a href="#methode" data-i18n="nav.method">Méthode</a>
        <a href="#offres" data-i18n="nav.offer">Offres</a>
        <a href="#temoignages" data-i18n="nav.testimonials">Avis</a>
        <a href="#faq" data-i18n="nav.faq">FAQ</a>
      </nav>

      <div class="header-cta">
        <div class="lang-switch" aria-label="Language switcher">
          <button class="lang-btn" type="button" onclick="setLanguage('fr')" id="langFr">FR</button>
          <button class="lang-btn" type="button" onclick="setLanguage('en')" id="langEn">EN</button>
        </div>
        <a href="https://calendly.com/nobleedgeagency/ton-audit-gratuit" target="_blank" rel="noopener" class="btn btn-primary btn-hamburger-cta" style="padding:11px 22px;font-size:14px;" data-i18n="nav.book">Réserver un appel</a>
        <div class="hamburger" onclick="toggleMenu()" aria-label="Open menu" role="button" tabindex="0">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </div>
</header>

<script>
const i18n = {
  fr: {
    "meta.title":"Noble Edge Agency | Agence Marketing & Community Management",
    "meta.description":"Noble Edge Agency — Agence marketing et communication spécialisée en community management, stratégie digitale, création de contenu et publicité en ligne.",
    "nav.why":"Pourquoi nous","nav.services":"Services","nav.method":"Méthode","nav.offer":"Offres","nav.testimonials":"Avis","nav.faq":"FAQ","nav.book":"Réserver un appel",
    "nav.home.mobile":"Accueil","nav.services.mobile":"Services","nav.method.mobile":"Méthode","nav.results.mobile":"Réalisations","nav.testimonials.mobile":"Témoignages","nav.faq.mobile":"FAQ","nav.contact.mobile":"Contact","nav.book.mobile":"Réserver un appel","mobile.close":"✕"
  },
  en: {
    "meta.title":"Noble Edge Agency | Marketing & Community Management Agency",
    "meta.description":"Noble Edge Agency — Marketing and communication agency specializing in community management, digital strategy, content creation, and online advertising.",
    "nav.why":"Why us","nav.services":"Services","nav.method":"Method","nav.offer":"Offers","nav.testimonials":"Reviews","nav.faq":"FAQ","nav.book":"Book a call",
    "nav.home.mobile":"Home","nav.services.mobile":"Services","nav.method.mobile":"Method","nav.results.mobile":"Results","nav.testimonials.mobile":"Testimonials","nav.faq.mobile":"FAQ","nav.contact.mobile":"Contact","nav.book.mobile":"Book a call","mobile.close":"✕"
  }
};

function setLanguage(lang) {
  if (!i18n[lang]) return;
  localStorage.setItem('nobleedge-lang', lang);
  document.documentElement.lang = lang;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const value = i18n[lang][key];
    if (value !== undefined) el.textContent = value;
  });

  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    const key = el.getAttribute('data-i18n-html');
    const value = i18n[lang][key];
    if (value !== undefined) el.innerHTML = value;
  });

  document.querySelectorAll('[data-i18n-attr]').forEach(el => {
    el.getAttribute('data-i18n-attr').split(',').forEach(pair => {
      const [attr, key] = pair.split(':').map(s => s.trim());
      const value = i18n[lang][key];
      if (value !== undefined) el.setAttribute(attr, value);
    });
  });

  document.querySelectorAll('option[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const value = i18n[lang][key];
    if (value !== undefined) el.textContent = value;
  });

  const frBtn = document.getElementById('langFr');
  const enBtn = document.getElementById('langEn');
  if (frBtn && enBtn) {
    frBtn.classList.toggle('active', lang === 'fr');
    enBtn.classList.toggle('active', lang === 'en');
  }
}

function toggleMenu() {
  const menu = document.getElementById('mobileMenu');
  menu.classList.toggle('open');
  document.body.style.overflow = menu.classList.contains('open') ? 'hidden' : '';
}

function toggleFaq(el) {
  const item = el.parentElement;
  const answer = item.querySelector('.faq-answer');
  const isOpen = item.classList.contains('open');
  document.querySelectorAll('.faq-item.open').forEach(i => {
    i.classList.remove('open');
    i.querySelector('.faq-answer').style.maxHeight = '0';
  });
  if (!isOpen) {
    item.classList.add('open');
    answer.style.maxHeight = answer.scrollHeight + 'px';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('nobleedge-lang');
  const auto = (navigator.language || 'fr').toLowerCase().startsWith('en') ? 'en' : 'fr';
  setLanguage(saved || auto);
});

document.getElementById('contactForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const prenom = document.getElementById('f-prenom').value.trim();
  const nom = document.getElementById('f-nom').value.trim();
  const email = document.getElementById('f-email').value.trim();
  const entreprise = document.getElementById('f-entreprise').value.trim();
  const service = document.getElementById('f-service').value;
  const message = document.getElementById('f-message').value.trim();
  if (!prenom || !nom || !email) return;
  const lang = localStorage.getItem('nobleedge-lang') || 'fr';
  const subject = encodeURIComponent(lang === 'en' ? `Contact request — ${service || 'Noble Edge Agency'}` : `Demande de contact — ${service || 'Noble Edge Agency'}`);
  const body = encodeURIComponent(
    lang === 'en'
      ? `Hello,\n\nFirst name: ${prenom}\nLast name: ${nom}\nEmail: ${email}\n${entreprise ? `Company: ${entreprise}\n` : ''}${service ? `Requested service: ${service}\n` : ''}${message ? `\nMessage:\n${message}` : ''}\n\nBest regards,\n${prenom} ${nom}`
      : `Bonjour,\n\nPrénom : ${prenom}\nNom : ${nom}\nEmail : ${email}\n${entreprise ? `Entreprise : ${entreprise}\n` : ''}${service ? `Service souhaité : ${service}\n` : ''}${message ? `\nMessage :\n${message}` : ''}\n\nCordialement,\n${prenom} ${nom}`
  );
  const link = document.createElement('a');
  link.href = `mailto:nobleedgeagency@gmail.com?subject=${subject}&body=${body}`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  document.getElementById('contactForm').style.display = 'none';
  document.getElementById('formSuccess').style.display = 'block';
});
</script>

</body>
</html>

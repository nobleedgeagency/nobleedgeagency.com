<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noble Edge Agency | Agence Marketing & Community Management</title>
  <meta name="description" content="Noble Edge Agency — Agence marketing et communication spécialisée en community management, stratégie digitale, création de contenu et publicité en ligne." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dark: #0a0af; --dark2: #12121a; --dark3: #1a1a28;
      --purple: #6c3fff; --purple-light: #8b5cf6; --purple-soft: #a78bfa;
      --white: #ffffff; --gray: #9ca3af; --gray-light: #d1d5db;
      --border: rgba(255,255,255,0.07); --card-bg: rgba(255,255,255,0.035);
      --radius: 16px; --radius-lg: 24px;
      --shadow: 0 8px 40px rgba(0,0,0,0.4); --shadow-purple: 0 0 40px rgba(108,63,255,0.25);
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: var(--dark); color: var(--white); line-height: 1.6; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: var(--dark2); } ::-webkit-scrollbar-thumb { background: var(--purple); border-radius: 3px; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    .gradient-text { background: linear-gradient(135deg, #fff 0%, var(--purple-soft) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(108,63,255,0.12); border: 1px solid rgba(108,63,255,0.3); color: var(--purple-soft); padding: 6px 16px; border-radius: 100px; font-size: 13px; font-weight: 500; }
    .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--purple-soft); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.25s ease; text-decoration: none; border: none; white-space: nowrap; }
    .btn-primary { background: linear-gradient(135deg, var(--purple) 0%, var(--purple-light) 100%); color: #fff; box-shadow: 0 4px 24px rgba(108,63,255,0.35); }
    .btn-primary:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 8px 32px rgba(108,63,255,0.5); }
    .btn-secondary { background: rgba(255,255,255,0.06); color: #fff; border: 1px solid var(--border); backdrop-filter: blur(10px); }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
    .section-label { font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--purple-soft); margin-bottom: 12px; }
    .section-title { font-size: clamp(24px, 4vw, 42px); font-weight: 800; line-height: 1.15; margin-bottom: 16px; }
    .section-subtitle { font-size: 16px; color: var(--gray); max-width: 600px; line-height: 1.7; }

    /* ===== MOTION DESIGN UTILITAIRE (version WOW) ===== */
    .motion-fade-up {
      opacity: 0;
      transform: translateY(40px) scale(0.96);
      animation: motion-fade-up 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .motion-fade-up-fast {
      opacity: 0;
      transform: translateY(28px) scale(0.97);
      animation: motion-fade-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .motion-delay-1 { animation-delay: 0.15s; }
    .motion-delay-2 { animation-delay: 0.35s; }
    .motion-delay-3 { animation-delay: 0.55s; }
    .motion-delay-4 { animation-delay: 0.8s; }

    @keyframes motion-fade-up {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.96);
      }
      60% {
        opacity: 1;
        transform: translateY(-4px) scale(1.02);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .motion-scroll {
      opacity: 0;
      transform: translateY(60px) scale(0.96);
      filter: blur(4px);
      transition:
        opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.9s cubic-bezier(0.16, 1, 0.3, 1),
        filter 0.6s ease-out;
    }
    .motion-scroll.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }

    .motion-scale-on-hover {
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .motion-scale-on-hover:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 16px 40px rgba(0,0,0,0.45);
      border-color: rgba(108,63,255,0.5);
    }

    .motion-subtle-float {
      animation: subtle-float 10s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes subtle-float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @media (max-width: 480px) {
      .motion-scroll {
        filter: none;
        transform: translateY(40px) scale(0.97);
      }
    }

    /* ===== HEADER ===== */
    header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; padding: 18px 0; transition: all 0.3s ease; }
    header.scrolled { background: rgba(10,10,15,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 12px 0; }
    .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; flex-shrink: 0; }
    .logo-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--dark3) 0%, #2d1b69 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(108,63,255,0.3); flex-shrink: 0; padding: 9px; }
    .logo-icon svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .logo-text { font-size: 17px; font-weight: 800; color: var(--white); letter-spacing: -0.3px; }
    .logo-text span { color: var(--purple-soft); }
    nav { display: flex; align-items: center; gap: 4px; }
    nav a { color: var(--gray); font-size: 14px; font-weight: 500; text-decoration: none; padding: 8px 12px; border-radius: 8px; transition: all 0.2s; white-space: nowrap; }
    nav a:hover { color: var(--white); background: rgba(255,255,255,0.06); }
    .header-cta { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 8px; }
    .hamburger span { width: 22px; height: 2px; background: var(--white); border-radius: 2px; transition: all 0.3s; }
    .mobile-menu { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(10,10,15,0.98); backdrop-filter: blur(20px); z-index: 999; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 20px; }
    .mobile-menu.open { display: flex; }
    .mobile-menu a { color: var(--white); font-size: 22px; font-weight: 700; text-decoration: none; transition: color 0.2s; }
    .mobile-menu a:hover { color: var(--purple-soft); }
    .mobile-close { position: absolute; top: 24px; right: 24px; font-size: 28px; cursor: pointer; color: var(--gray); background: none; border: none; }

    /* ===== HERO ===== */
    #hero { min-height: 100vh; display: flex; align-items: center; padding: 120px 0 80px; position: relative; overflow: hidden; }
    .hero-bg { position: absolute; inset: 0; }
    .hero-glow-1 { position: absolute; top: 10%; left: 20%; width: 600px; height: 600px; background: radial-gradient(circle, rgba(108,63,255,0.15) 0%, transparent 70%); animation: float 8s ease-in-out infinite; }
    .hero-glow-2 { position: absolute; bottom: 20%; right: 10%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(139,92,246,0.1) 0%, transparent 70%); animation: float 10s ease-in-out infinite reverse; }
    .hero-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 60px 60px; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
    .hero-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; position: relative; }
    .hero-badge { margin-bottom: 20px; }
    .hero h1 { font-size: clamp(32px, 5.5vw, 64px); font-weight: 900; line-height: 1.08; letter-spacing: -1.5px; margin-bottom: 20px; }
    .hero-desc { font-size: 17px; color: var(--gray); line-height: 1.7; margin-bottom: 32px; max-width: 520px; }
    .hero-ctas { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 48px; }
    .hero-stats { display: flex; gap: 32px; flex-wrap: wrap; }
    .stat-num { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #fff, var(--purple-soft)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .stat-label { font-size: 13px; color: var(--gray); margin-top: 2px; }
    .hero-visual { display: flex; flex-direction: column; gap: 12px; }
    .hero-card-main { background: linear-gradient(135deg, var(--dark2) 0%, var(--dark3) 100%); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 28px; box-shadow: var(--shadow-purple); }
    .hero-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 8px; flex-wrap: wrap; }
    .hero-card-title { font-size: 15px; font-weight: 700; }
    .hero-card-badge { background: rgba(34,197,94,0.12); color: #4ade80; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 100px; border: 1px solid rgba(34,197,94,0.2); white-space: nowrap; }
    .chart-bars { display: flex; align-items: flex-end; gap: 8px; height: 80px; margin-bottom: 16px; }
    .bar { flex: 1; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, var(--purple) 0%, var(--purple-light) 100%); opacity: 0.7; transform-origin: bottom; }

    /* Animation des barres du graphique */
    .chart-bars .bar {
      animation: bar-grow 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform: scaleY(0.1);
    }
    .chart-bars .bar:nth-child(1) { animation-delay: 0.1s; }
    .chart-bars .bar:nth-child(2) { animation-delay: 0.16s; }
    .chart-bars .bar:nth-child(3) { animation-delay: 0.22s; }
    .chart-bars .bar:nth-child(4) { animation-delay: 0.28s; }
    .chart-bars .bar:nth-child(5) { animation-delay: 0.34s; }
    .chart-bars .bar:nth-child(6) { animation-delay: 0.4s; }
    .chart-bars .bar:nth-child(7) { animation-delay: 0.46s; }
    .chart-bars .bar:nth-child(8) { animation-delay: 0.52s; }

    @keyframes bar-grow {
      0%   { transform: scaleY(0.1); opacity: 0; }
      40%  { transform: scaleY(1.1); opacity: 1; }
      100% { transform: scaleY(1);   opacity: 1; }
    }

    .chart-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .chart-stat { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 12px; }
    .chart-stat-num { font-size: 20px; font-weight: 800; color: var(--white); }
    .chart-stat-num.up { color: #4ade80; }
    .chart-stat-label { font-size: 11px; color: var(--gray); margin-top: 2px; }
    .hero-cards-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .hero-card-floating { background: var(--dark2); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 12px; }
    .floating-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .floating-title { font-size: 13px; font-weight: 700; }
    .floating-sub { font-size: 11px; color: var(--gray); }

    /* ===== TRUST BAND ===== */
    .trust-band { padding: 36px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); overflow: hidden; }
    .trust-inner { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .trust-item { display: flex; align-items: center; gap: 10px; white-space: nowrap; color: var(--gray); font-size: 14px; font-weight: 500; }
    .trust-item svg { color: var(--purple-soft); flex-shrink: 0; }

    /* ===== SECTIONS COMMUNES ===== */
    #pourquoi { padding: 80px 0; }
    .why-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 48px; }
    .why-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; transition: all 0.3s ease; }
    .why-card:hover { border-color: rgba(108,63,255,0.4); background: rgba(108,63,255,0.05); transform: translateY(-4px); box-shadow: var(--shadow-purple); }
    .why-icon { width: 48px; height: 48px; background: rgba(108,63,255,0.12); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 18px; font-size: 22px; }
    .why-title { font-size: 17px; font-weight: 700; margin-bottom: 10px; }
    .why-desc { font-size: 14px; color: var(--gray); line-height: 1.65; }

    /* ===== SERVICES ===== */
    #services { padding: 80px 0; background: linear-gradient(180deg, transparent 0%, rgba(108,63,255,0.03) 50%, transparent 100%); }
    .services-header { text-align: center; margin-bottom: 56px; }
    .services-header .section-subtitle { margin: 0 auto; }
    .cm-featured { background: linear-gradient(135deg, rgba(108,63,255,0.12) 0%, rgba(139,92,246,0.06) 100%); border: 1px solid rgba(108,63,255,0.3); border-radius: var(--radius-lg); padding: 40px; margin-bottom: 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
    .cm-tag { display: inline-block; background: var(--purple); color: #fff; font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 100px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 14px; }
    .cm-title { font-size: clamp(20px, 3vw, 30px); font-weight: 800; margin-bottom: 12px; }
    .cm-desc { font-size: 15px; color: var(--gray); line-height: 1.7; margin-bottom: 24px; }
    .cm-features { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .cm-features li { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: var(--gray-light); }
    .cm-features li::before { content: '✓'; color: var(--purple-soft); font-weight: 700; flex-shrink: 0; }
    .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
    .service-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; transition: all 0.3s ease; }
    .service-card:hover { border-color: rgba(108,63,255,0.35); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
    .service-icon { font-size: 28px; margin-bottom: 16px; }
    .service-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .service-desc { font-size: 13px; color: var(--gray); line-height: 1.6; margin-bottom: 14px; }
    .service-benefit { font-size: 12px; font-weight: 600; color: var(--purple-soft); background: rgba(108,63,255,0.08); padding: 6px 12px; border-radius: 8px; display: inline-block; }

    /* ===== MÉTHODE ===== */
    #methode { padding: 80px 0; }
    .method-header { text-align: center; margin-bottom: 56px; }
    .method-header .section-subtitle { margin: 0 auto; }
    .method-steps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; position: relative; }
    .method-steps::before { content: ''; position: absolute; top: 36px; left: 10%; right: 10%; height: 1px; background: linear-gradient(90deg, transparent, var(--purple), transparent); }
    .method-step { text-align: center; padding: 0 16px; position: relative; }
    .step-num { width: 72px; height: 72px; background: linear-gradient(135deg, var(--dark3), #2d1b69); border: 2px solid rgba(108,63,255,0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 22px; font-weight: 900; color: var(--purple-soft); position: relative; z-index: 1; }
    .step-title { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
    .step-desc { font-size: 13px; color: var(--gray); line-height: 1.6; }
    .step-benefit { font-size: 12px; color: var(--purple-soft); font-weight: 600; margin-top: 8px; }

    /* ===== OFFRES ===== */
    #offres { padding: 80px 0; background: linear-gradient(180deg, transparent 0%, rgba(108,63,255,0.03) 50%, transparent 100%); }
    .pricing-header { text-align: center; margin-bottom: 56px; }
    .pricing-header .section-subtitle { margin: 0 auto; }
    .offre-unique { max-width: 700px; margin: 0 auto; background: linear-gradient(135deg, rgba(108,63,255,0.15) 0%, rgba(139,92,246,0.08) 100%); border: 1px solid rgba(108,63,255,0.5); border-radius: var(--radius-lg); padding: 48px; text-align: center; box-shadow: var(--shadow-purple); position: relative; }
    .offre-unique .pricing-badge { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, var(--purple), var(--purple-light)); color: #fff; font-size: 11px; font-weight: 700; padding: 5px 18px; border-radius: 100px; white-space: nowrap; }
    .offre-unique h3 { font-size: clamp(20px, 3vw, 28px); font-weight: 900; margin-bottom: 8px; }
    .offre-unique .offre-sub { font-size: 16px; color: var(--gray); margin-bottom: 32px; }
    .offre-features { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 36px; text-align: left; }
    .offre-features li { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; color: var(--gray-light); }
    .offre-features li span.check { color: #4ade80; font-weight: 700; flex-shrink: 0; }
    .offre-note { font-size: 13px; color: var(--gray); margin-top: 20px; font-style: italic; }

    /* ===== RÉALISATIONS ===== */
    #realisations { padding: 80px 0; }
    .real-header { margin-bottom: 48px; }
    .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 48px; }
    .kpi-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; text-align: center; }
    .kpi-num { font-size: 38px; font-weight: 900; background: linear-gradient(135deg, #fff, var(--purple-soft)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 6px; }
    .kpi-label { font-size: 13px; color: var(--gray); }
    .case-studies { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
    .case-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; }
    .case-sector { font-size: 11px; font-weight: 700; color: var(--purple-soft); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; }
    .case-title { font-size: 18px; font-weight: 800; margin-bottom: 12px; }
    .case-challenge { font-size: 13px; color: var(--gray); line-height: 1.6; margin-bottom: 20px; }
    .case-results { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .case-result { background: rgba(108,63,255,0.08); border-radius: 10px; padding: 12px; text-align: center; }
    .case-result-num { font-size: 20px; font-weight: 800; color: var(--purple-soft); }
    .case-result-label { font-size: 11px; color: var(--gray); margin-top: 2px; }
    .case-placeholder { font-size: 12px; color: var(--gray); text-align: center; margin-top: 16px; font-style: italic; border-top: 1px solid var(--border); padding-top: 12px; }

    /* ===== TEMOIGNAGES ===== */
    #temoignages { padding: 80px 0; background: linear-gradient(180deg, transparent 0%, rgba(108,63,255,0.03) 50%, transparent 100%); }
    .testi-header { text-align: center; margin-bottom: 48px; }
    .testi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
    .testi-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; transition: all 0.3s; }
    .testi-card:hover { border-color: rgba(108,63,255,0.3); transform: translateY(-3px); }
    .testi-stars { color: #fbbf24; font-size: 14px; margin-bottom: 16px; letter-spacing: 2px; }
    .testi-quote { font-size: 15px; color: var(--gray-light); line-height: 1.7; margin-bottom: 20px; font-style: italic; }
    .testi-author { display: flex; align-items: center; gap: 12px; }
    .testi-avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--purple), var(--purple-light)); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; color: #fff; flex-shrink: 0; }
    .testi-name { font-size: 14px; font-weight: 700; }
    .testi-role { font-size: 12px; color: var(--gray); }

    /* ===== FAQ ===== */
    #faq { padding: 80px 0; }
    .faq-header { text-align: center; margin-bottom: 48px; }
    .faq-list { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .faq-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: all 0.3s; }
    .faq-item.open { border-color: rgba(108,63,255,0.3); }
    .faq-question { padding: 20px 24px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 15px; font-weight: 600; user-select: none; }
    .faq-question:hover { color: var(--purple-soft); }
    .faq-icon { width: 24px; height: 24px; background: rgba(108,63,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 14px; transition: transform 0.3s; color: var(--purple-soft); }
    .faq-item.open .faq-icon { transform: rotate(180deg); }

<!-- Assure-toi simplement que ton script IntersectionObserver utilise le nouveau threshold/rootMargin -->


<script>
  document.addEventListener('DOMContentLoaded', () => {
    const scrollElements = document.querySelectorAll('.motion-scroll');

    const observer = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          obs.unobserve(entry.target);
        }
      });
    }, {
      threshold: 0.1,
      rootMargin: '0px 0px -10% 0px'
    });

    scrollElements.forEach(el => observer.observe(el));
  });
</script>
